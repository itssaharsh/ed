name: YouTube Shorts Generator

on:
  schedule:
    # RUN EVERY 4 HOURS (6 times a day).
    # YouTube strictly limits free API uploads to 6 videos per day.
    # Running more often will cause hidden 403 quota errors.
    # NOTE: cron '17 */4 * * *' = minute 17 of every 4th hour (0,4,8,12,16,20).
    - cron: '*/25 * * * *'
  workflow_dispatch: # Allows you to trigger a run manually from the GitHub UI
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run Python Script
        id: python_step  # <--- CRUCIAL: This ID lets us capture the new token from main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_CREDENTIALS_JSON_2: ${{ secrets.YOUTUBE_CREDENTIALS_JSON_2 }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$YOUTUBE_CREDENTIALS_JSON" > credentials_1.json
          echo "$YOUTUBE_CREDENTIALS_JSON_2" > credentials_2.json
          export YOUTUBE_CLIENT_SECRETS_PATH=client_secrets.json
          export YOUTUBE_CREDENTIALS_PATH_1=credentials_1.json
          export YOUTUBE_CREDENTIALS_PATH_2=credentials_2.json
          
          python main.py
          # Propagate the Python exit code so the Actions job turns red on upload failure
          exit $?

      - name: Permanently Update YouTube Credentials Secret 1
        # ONLY run this step if main.py successfully generated and passed a new token
        if: steps.python_step.outputs.new_youtube_creds_1 != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} 
          NEW_CREDS: ${{ steps.python_step.outputs.new_youtube_creds_1 }}
        run: |
          gh secret set YOUTUBE_CREDENTIALS_JSON --body "$NEW_CREDS" --repo ${{ github.repository }}
          echo "Successfully updated YouTube credentials 1 in GitHub Secrets!"

      - name: Permanently Update YouTube Credentials Secret 2
        if: steps.python_step.outputs.new_youtube_creds_2 != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} 
          NEW_CREDS: ${{ steps.python_step.outputs.new_youtube_creds_2 }}
        run: |
          gh secret set YOUTUBE_CREDENTIALS_JSON_2 --body "$NEW_CREDS" --repo ${{ github.repository }}
          echo "Successfully updated YouTube credentials 2 in GitHub Secrets!"
