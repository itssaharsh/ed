name: Generate and Upload YouTube Shorts

on:
  schedule:
    # Approximately 20 runs/day at staggered times (roughly every 72 minutes).
    - cron: "0 0 * * *"
    - cron: "12 1 * * *"
    - cron: "24 2 * * *"
    - cron: "36 3 * * *"
    - cron: "48 4 * * *"
    - cron: "0 6 * * *"
    - cron: "12 7 * * *"
    - cron: "24 8 * * *"
    - cron: "36 9 * * *"
    - cron: "48 10 * * *"
    - cron: "0 12 * * *"
    - cron: "12 13 * * *"
    - cron: "24 14 * * *"
    - cron: "36 15 * * *"
    - cron: "48 16 * * *"
    - cron: "0 18 * * *"
    - cron: "12 19 * * *"
    - cron: "24 20 * * *"
    - cron: "36 21 * * *"
    - cron: "48 22 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
      YOUTUBE_CLIENT_SECRETS_PATH: ${{ github.workspace }}/client_secrets.json
      YOUTUBE_CREDENTIALS_PATH: ${{ github.workspace }}/credentials.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Materialize Google auth files
        working-directory: .
        run: |
          if [ -n "$YOUTUBE_CLIENT_SECRETS_JSON" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRETS_JSON" > client_secrets.json
          fi
          if [ -n "$YOUTUBE_CREDENTIALS_JSON" ]; then
            printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > credentials.json
          fi

      - name: Run Shorts pipeline
        working-directory: .
        run: |
          python main.py