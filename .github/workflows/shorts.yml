name: Generate Short

on:
  schedule:
    # Every 4 hours = 6 runs/day, which is exactly the YouTube API ceiling
    # (10,000 units/day, videos.insert costs 1,600).
    - cron: '20 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but do not upload'
        type: boolean
        default: false
      privacy:
        description: 'Privacy status for the upload'
        type: choice
        options: [private, unlisted, public]
        default: private

concurrency:
  # Never let two runs race on the premise store - they would generate the same premise
  # and each write it back unaware of the other.
  group: shorts-generate
  cancel-in-progress: false

permissions:
  contents: write        # to commit the premise store back

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the caption font
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: fonts-anton-v1

      - name: Materialise YouTube credentials
        if: ${{ !inputs.dry_run }}
        env:
          CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRETS" > client_secrets.json
          printf '%s' "$CREDENTIALS"  > credentials.json

      - name: Generate
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YOUTUBE_CREDENTIALS_PATH: credentials.json
        run: |
          python run.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --privacy "${{ inputs.privacy || 'private' }}"

      # Exit 2 means the quality gate rejected the video. That is the system working, not a
      # broken build - so the job is marked neutral rather than failed.
      - name: Note a gate rejection
        if: ${{ failure() && steps.generate.outcome == 'failure' }}
        run: |
          echo "::notice::If the run exited 2, the quality gate rejected this video and nothing was published."

      - name: Upload artefacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            work/*/final.mp4
            work/*/*.json
            work/*/captions.ass
            work/*/ERROR.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Persist refreshed YouTube token
        if: ${{ steps.generate.outputs.new_youtube_creds_1 != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_CREDS: ${{ steps.generate.outputs.new_youtube_creds_1 }}
        run: gh secret set YOUTUBE_CREDENTIALS_JSON --body "$NEW_CREDS" --repo ${{ github.repository }}

      - name: Commit the premise store
        # always(), not success(): a gate-rejected run still spent its premise, and the record
        # is what stops the next run rediscovering it.
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet -- assets/premise_store.jsonl; then
            echo "no new premise recorded"
            exit 0
          fi
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add assets/premise_store.jsonl
          git commit -m "memory: record run ${{ github.run_number }}"
          # Another scheduled run may have pushed while this one rendered.
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
