name: Generate Short

on:
  # ── PUBLISHING PAUSED (2026-09-19) ──────────────────────────────────────────
  # The schedule is commented out while dry runs validate the fixes. Leaving it
  # here but disabling the workflow meant every manual dry-run dispatch briefly
  # re-armed the public cron. To resume publishing, uncomment `schedule:` below.
  # schedule:
  #   # Every 2 hours = 12 runs/day.
  #   #
  #   # This was every 4 hours because videos.insert cost 1,600 of a shared 10,000-unit daily
  #   # quota, making 6 uploads/day a hard ceiling. That is no longer true: videos.insert now has
  #   # its own bucket at 1 unit per call, 100 calls/day. Upload is not the constraint any more.
  #   #
  #   # The real ceiling is Groq Orpheus at 100 requests/day (~7 TTS calls per video, so ~14
  #   # videos), and before that the per-run image wall-clock. 12/day sits just under it.
  #   - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but do not upload'
        type: boolean
        default: false
      privacy:
        description: 'Privacy status for the upload'
        type: choice
        options: [public, unlisted, private]
        default: public
      brief:
        description: 'Render a hand-authored brief instead of generating (e.g. briefs/kettle_twice.json)'
        type: string
        default: ''
      doctor:
        description: 'Only run the provider preflight (lists live model ids; spends no generation quota)'
        type: boolean
        default: false

concurrency:
  # Never let two runs race on the premise store - they would generate the same premise
  # and each write it back unaware of the other.
  group: shorts-generate
  cancel-in-progress: false

permissions:
  contents: write        # to commit the premise store back

jobs:
  generate:
    runs-on: ubuntu-latest
    # Nine images at up to 180s each, plus retries, plus render. 60 was uncomfortably close.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache the caption font
        uses: actions/cache@v4
        with:
          path: assets/fonts
          key: fonts-anton-v1

      - name: Materialise YouTube credentials
        if: ${{ !inputs.dry_run }}
        env:
          CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRETS" > client_secrets.json
          printf '%s' "$CREDENTIALS"  > credentials.json

      - name: Generate
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YOUTUBE_CREDENTIALS_PATH: credentials.json
        run: |
          if [ "${{ inputs.doctor }}" = "true" ]; then python run.py --doctor || true; exit 0; fi
          python run.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.brief && format('--brief {0}', inputs.brief) || '' }} \
            --privacy "${{ inputs.privacy || 'public' }}"

      # Exit 2 means the quality gate rejected the video. That is the system working, not a
      # broken build - so the job is marked neutral rather than failed.
      - name: Note a gate rejection
        if: ${{ failure() && steps.generate.outcome == 'failure' }}
        run: |
          echo "::notice::If the run exited 2, the quality gate rejected this video and nothing was published."

      - name: Upload artefacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            work/*/final.mp4
            work/*/*.json
            work/*/captions.ass
            work/*/ERROR.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Persist refreshed YouTube token
        if: ${{ steps.generate.outputs.new_youtube_creds_1 != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_CREDS: ${{ steps.generate.outputs.new_youtube_creds_1 }}
        run: gh secret set YOUTUBE_CREDENTIALS_JSON --body "$NEW_CREDS" --repo ${{ github.repository }}

      - name: Commit the premise store
        # always(), not success(): a gate-rejected run still spent its premise, and the record
        # is what stops the next run rediscovering it.
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet -- assets/premise_store.jsonl; then
            echo "no new premise recorded"
            exit 0
          fi
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add assets/premise_store.jsonl
          git commit -m "memory: record run ${{ github.run_number }}"
          # Another scheduled run may have pushed while this one rendered.
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push
